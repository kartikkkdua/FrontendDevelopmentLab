<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Calculator</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --btn-color: #f0f0f0;
      --accent-color: #2196f3;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #ffffff;
      --btn-color: #1e1e1e;
      --accent-color: #bb86fc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    .calculator {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
      border-radius: 20px;
      background: var(--btn-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    .display {
      width: 100%;
      height: 60px;
      font-size: 1.5rem;
      text-align: right;
      padding: 0.5rem;
      background: var(--bg-color);
      border: none;
      border-radius: 10px;
      margin-bottom: 1rem;
      color: var(--text-color);
    }
    .buttons, .scientific {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    button {
      padding: 1rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--accent-color);
      color: white;
      transition: background 0.3s;
    }
    button:hover {
      background: #1976d2;
    }
    .history {
      max-height: 100px;
      overflow-y: auto;
      background: var(--bg-color);
      margin-top: 1rem;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .theme-toggle {
      margin: 0.5rem 0;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="calculator" id="calculator">
    <div class="theme-toggle">
      <button onclick="toggleTheme()">Toggle Theme</button>
    </div>
    <input type="text" class="display" id="display" readonly />
    <div class="buttons">
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('/')">/</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('*')">*</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('-')">-</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()">=</button>
      <button onclick="append('+')">+</button>

      <button onclick="append('(')">(</button>
      <button onclick="append(')')">)</button>
      <button onclick="clearDisplay()">C</button>
      <button onclick="backspace()">⌫</button>
    </div>

    <div class="scientific">
      <button onclick="append('Math.sin(')">sin</button>
      <button onclick="append('Math.cos(')">cos</button>
      <button onclick="append('Math.tan(')">tan</button>
      <button onclick="append('Math.sqrt(')">√</button>

      <button onclick="append('Math.log10(')">log</button>
      <button onclick="append('Math.log(')">ln</button>
      <button onclick="append('Math.pow(')">^</button>
      <button onclick="append('Math.exp(')">e^</button>

      <button onclick="memoryAdd()">M+</button>
      <button onclick="memorySubtract()">M-</button>
      <button onclick="memoryRecall()">MR</button>
      <button onclick="memoryClear()">MC</button>
    </div>

    <div class="history" id="history"></div>
  </div>

  <script>
    let display = document.getElementById('display');
    let history = document.getElementById('history');
    let memory = 0;

    function append(val) {
      display.value += val;
    }

    function clearDisplay() {
      display.value = '';
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        let result = eval(display.value);
        history.innerHTML += `<div>${display.value} = ${result}</div>`;
        display.value = result;
      } catch {
        display.value = 'Error';
      }
    }

    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
    }

    function memoryAdd() {
      memory += parseFloat(display.value || 0);
    }

    function memorySubtract() {
      memory -= parseFloat(display.value || 0);
    }

    function memoryRecall() {
      display.value += memory;
    }

    function memoryClear() {
      memory = 0;
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.', '(', ')'].includes(e.key)) {
        append(e.key);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        calculate();
      } else if (e.key === 'Backspace') {
        backspace();
      }
    });
  </script>
</body>
</html>
