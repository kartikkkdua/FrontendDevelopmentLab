<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #000, #222);
        color: white;
        font-family: "Poppins", sans-serif;
      }

      .container {
        background: rgba(255, 255, 255, 0.05);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
        width: 400px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      h2 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 15px;
      }

      .input-group {
        position: relative;
        width: 100%;
      }

      input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        font-size: 16px;
        background: transparent;
        color: white;
        outline: none;
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      input:focus {
        border-color: white;
      }

      .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
        color: white;
      }

      .progress-container {
        background: rgba(255, 255, 255, 0.2);
        height: 8px;
        border-radius: 10px;
        margin-top: 15px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 10px;
        transition: width 0.3s ease-in-out;
      }

      #strength {
        font-size: 14px;
        font-weight: 600;
        margin-top: 10px;
      }

      .weak {
        color: lightgray;
      }
      .moderate {
        color: gray;
      }
      .strong {
        color: white;
      }

      .requirements {
        text-align: left;
        font-size: 14px;
        margin-top: 15px;
        color: rgba(255, 255, 255, 0.8);
      }

      .requirements p {
        display: flex;
        align-items: center;
        margin: 5px 0;
        transition: 0.3s;
      }

      .requirements p.valid {
        color: white;
        font-weight: 600;
      }

      .requirements p::before {
        content: "✔";
        font-size: 14px;
        margin-right: 5px;
        color: rgba(255, 255, 255, 0.7);
      }

      button {
        background: none;
        color: white;
        border: 1px solid white;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
        font-size: 16px;
        font-weight: 600;
        transition: 0.3s;
      }

      button:hover {
        background: white;
        color: black;
      }

      button:disabled {
        background: transparent;
        border: 1px solid gray;
        color: gray;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Password Strength Checker</h2>
      <div class="input-group">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        />
        <span class="toggle-password">👁</span>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <p id="strength">Password Strength: N/A</p>

      <div class="requirements">
        <p id="req-length">At least 8 characters</p>
        <p id="req-uppercase">At least one uppercase letter</p>
        <p id="req-lowercase">At least one lowercase letter</p>
        <p id="req-number">At least one number</p>
        <p id="req-special">At least one special character (!@#$%^&*)</p>
      </div>

      <button id="submit" disabled>Submit</button>
    </div>

    <script>
      $(document).ready(function () {
        $("#password").on("input", function () {
          let password = $(this).val();
          let strength = checkStrength(password);

          $("#strength")
            .text("Password Strength: " + strength.text)
            .removeClass("weak moderate strong")
            .addClass(strength.class);

          $("#progress-bar")
            .css("width", strength.progressWidth)
            .css("background", strength.color);

          updateRequirements(password);
          $("#submit").prop("disabled", strength.class !== "strong");
        });

        $(".toggle-password").on("click", function () {
          let type =
            $("#password").attr("type") === "password" ? "text" : "password";
          $("#password").attr("type", type);
          $(this).text(type === "password" ? "👁" : "🙈");
        });

        $("#submit").on("click", function () {
          window.location.href = "dashboard.html";
        });
      });

      function checkStrength(password) {
        let strength = {
          text: "Weak",
          class: "weak",
          progressWidth: "20%",
          color: "lightgray",
        };

        let hasUpper = /[A-Z]/.test(password);
        let hasLower = /[a-z]/.test(password);
        let hasNumber = /[0-9]/.test(password);
        let hasSpecial = /[!@#$%^&*]/.test(password);
        let isValidLength = password.length >= 8;

        if (
          isValidLength &&
          (hasUpper || hasLower || hasNumber || hasSpecial)
        ) {
          strength = {
            text: "Moderate",
            class: "moderate",
            progressWidth: "50%",
            color: "gray",
          };
        }
        if (isValidLength && hasUpper && hasLower && hasNumber && hasSpecial) {
          strength = {
            text: "Strong",
            class: "strong",
            progressWidth: "100%",
            color: "white",
          };
        }

        return strength;
      }

      function updateRequirements(password) {
        $("#req-length").toggleClass("valid", password.length >= 8);
        $("#req-uppercase").toggleClass("valid", /[A-Z]/.test(password));
        $("#req-lowercase").toggleClass("valid", /[a-z]/.test(password));
        $("#req-number").toggleClass("valid", /[0-9]/.test(password));
        $("#req-special").toggleClass("valid", /[!@#$%^&*]/.test(password));
      }
    </script>
  </body>
</html>
